services:
  db:
    image: postgres:16
    container_name: floorplanner-db
    environment:
      POSTGRES_DB: floorplanner
      POSTGRES_USER: floorplanner
      POSTGRES_PASSWORD: floorplanner_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U floorplanner -d floorplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
