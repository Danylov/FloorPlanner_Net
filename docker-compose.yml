services:
  db:
    image: postgres:16
    container_name: floorplanner-db
    environment:
      POSTGRES_DB: floorplanner
      POSTGRES_USER: floorplanner
      POSTGRES_PASSWORD: floorplanner_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U floorplanner -d floorplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: floorplanner-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__Default=Host=db;Port=5432;Database=floorplanner;Username=floorplanner;Password=floorplanner_dev
      - Swagger__Enabled=true
      - Database__MigrateOnStartup=true
      - Database__SeedDemoData=true
    ports:
      - "5080:8080"

volumes:
  pgdata:
